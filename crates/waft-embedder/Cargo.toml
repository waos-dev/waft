[package]
name = "waft-embedder"
description = "dart:ui host traits and value types for Waft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Images and drawn pixels for tests, which need a GPU device to exist at all, and flutter_test's
# FlutterTest font (`TestFontSource`).
test-support = ["dep:pollster", "valo-codec", "valo-codec-software/default"]
# Opening encoded pictures with valo's decoders (`valo_images`), for a host that decodes with them.
valo-codec = ["dep:valo-codec"]
# Serde's derives for the values a host gives a view and takes from it, for an app that sends them
# between processes.
serde = ["dep:serde"]

[dependencies]
# A body's bytes, shared when it is sent again.
bytes.workspace = true
# The request and response values of HTTP: methods, URIs, statuses and headers, whose shapes
# every platform's client and the framework's own users share.
http.workspace = true
indexmap.workspace = true
raw-window-handle.workspace = true
pollster = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
valo.workspace = true
valo-codec = { workspace = true, optional = true }
# Pixels read back encoded as a PNG, in software on every host (`encode_png`): the inspector's
# screenshots and a test's. `test-support` adds the decoders a test opens pictures with.
valo-codec-software = { version = "0.26.0", default-features = false, features = ["png"] }
valo-geometry.workspace = true
valo-system-fonts.workspace = true
web-time.workspace = true
# The device a host imports a hardware buffer on as a texture (`Platform::import_texture`), and the
# texture: wgpu's own types, which valo takes without re-exporting them.
wgpu.workspace = true
# A service extension's answer: JSON, as Flutter's are.
serde_json.workspace = true

[lints]
workspace = true
