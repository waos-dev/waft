[package]
name = "waft-test"
description = "Test scaffolding for Waft: a platform and a view to run an App under"
version.workspace = true
edition.workspace = true
license = "MIT AND BSD-3-Clause"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "Cargo.toml"]

[dependencies]
# The request and response values a mock HTTP client answers with.
http.workspace = true
waft-embedder = { workspace = true, features = ["test-support"] }
# The arena a leak snapshot reads.
waft-foundation.workspace = true
# Pixels encoded as a PNG to look at, the same on every machine.
valo-codec-software = "0.26.0"
# The system's fonts, for a test that looks at what its text draws as.
valo-system-fonts.workspace = true
# The device a video frame's texture is made on, which a mock frame names to make none.
wgpu.workspace = true

[dev-dependencies]
# Waits on an image codec's futures in the platform's tests.
pollster.workspace = true

[lints]
workspace = true
