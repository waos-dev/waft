[package]
name = "android_video_decoders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[package.metadata.waft]
identifier = "rs.waft.android-video-decoders"
name = "Android video decoders"

# The activity loads the library; the binary is the desktop's, which says the example is
# Android's. Named apart from the binary: on Windows a cdylib and a binary of one name write the
# same `.pdb`.
[lib]
name = "android_video_decoders_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "android_video_decoders"
path = "src/main.rs"

[dependencies]
waft.workspace = true
waft-embedder.workspace = true
waft-foundation.workspace = true
waft-painting.workspace = true
waft-widgets.workspace = true

# The system's log the checks report to, and the clips of the codecs beside H.264 the checks decode.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
waft-video-codecs = { workspace = true, features = ["test-support"] }

# Writing to the system's log needs `unsafe`, which the workspace forbids; here it is denied
# instead, and `log.rs` alone allows it.
[lints.rust]
unsafe_code = "deny"
